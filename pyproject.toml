[project]
name = "kitt-ai-workers"
version = "0.1.4"
requires-python = ">=3.10"
dependencies = [
  "kitt-protocol @ git+https://github.com/rfdetoni/kitt-protocol.git@97e1cad8dfc6d3a74fe2332530dc01a25e476516#subdirectory=sdk/python",
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.0",
]

[project.scripts]
kitt-stt = "kitt_workers.stt_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitt_workers*"]
exclude = ["packages*"]

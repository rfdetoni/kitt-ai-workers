[project]
name = "kitt-ai-workers"
version = "0.1.5"
requires-python = ">=3.10"
dependencies = [
  "kitt-protocol @ git+https://github.com/rfdetoni/kitt-protocol.git@c4ae476521e812ec1497a442cce6b276a26d9f80#subdirectory=sdk/python",
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.0",
]

[project.scripts]
kitt-stt = "kitt_workers.stt_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitt_workers*"]
exclude = ["packages*"]

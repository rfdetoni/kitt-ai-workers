[project]
name = "kitt-ai-workers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "kitt-protocol @ git+https://github.com/rfdetoni/kitt-protocol.git@main#subdirectory=sdk/python",
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.0",
]

[project.scripts]
kitt-stt = "kitt_workers.stt_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

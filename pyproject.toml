[project]
name = "kitt-ai-workers"
version = "0.1.23"
requires-python = ">=3.14"
dependencies = [
  "kitt-protocol @ git+https://github.com/rfdetoni/kitt-protocol.git@c624b094437d33fb3c6f1c9827f395ac8b6cb213#subdirectory=sdk/python",
]

[project.optional-dependencies]
stt = [
  "faster-whisper>=1.0",
]

[project.scripts]
kitt-stt = "kitt_workers.stt_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kitt_workers*"]
exclude = ["packages*"]

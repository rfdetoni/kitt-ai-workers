name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Install worker and shared agent dependency once
        run: |
          python -m pip install -e .
          python -m pip install -e packages/kitt-evolution
          python -m pip install --no-deps -e packages/kitt-evals
      - name: Worker protocol and STT boundaries
        run: python -m unittest tests.test_protocol tests.test_stt_server
      - name: Evolution security and atomic promotion
        run: python -m unittest discover -s packages/kitt-evolution/tests -p 'test_*.py'
      - name: Evaluation contract smoke
        run: python -m unittest discover -s packages/kitt-evals/tests -p 'test_*.py'
      - name: Static Python checks
        run: |
          python -m pip install ruff
          ruff check kitt_workers packages --select F401,F841,F821,E9 --exclude "**/__init__.py"
      - name: Verify installed dependency graph
        run: python -m pip check

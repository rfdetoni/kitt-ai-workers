name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - run: python -m pip install -e .
      - run: python -m unittest discover tests
      - name: Install evolution module
        run: python -m pip install -e packages/kitt-evolution
      - name: Test evolution module
        run: python -m unittest discover packages/kitt-evolution/tests
      - name: Install eval module
        run: python -m pip install -e packages/kitt-evals
      - name: Test eval module
        run: python -m unittest discover packages/kitt-evals/tests
      - name: Smoke-test eval module
        run: >-
          python -c "from kitt.evals.corpus import EvalRunner; from kitt.evals.retrieval import run_eval; print(EvalRunner, run_eval)"
      - name: Verify installed dependency graph
        run: python -m pip check

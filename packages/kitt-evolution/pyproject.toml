[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evolution"
version = "0.1.10"
description = "Offline staged self-evolution engine for K.I.T.T. skills"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@a94ce290cf8b7dce74b9e35d40b4e9aa93d85ea8",
]

[tool.setuptools.packages.find]
include = ["kitt.evolution*"]
namespaces = true

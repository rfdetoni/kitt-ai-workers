[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evolution"
version = "0.1.30"
description = "Offline staged self-evolution engine for K.I.T.T. skills"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@f51dbba8a0506e90366ddb4e95026dc6c6614699",
]

[tool.setuptools.packages.find]
include = ["kitt.evolution*"]
namespaces = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evolution"
version = "0.1.25"
description = "Offline staged self-evolution engine for K.I.T.T. skills"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@aee552caf0ef4fd7bd44b12a85e15e7df1febed4",
]

[tool.setuptools.packages.find]
include = ["kitt.evolution*"]
namespaces = true

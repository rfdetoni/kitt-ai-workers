[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evolution"
version = "0.1.36"
description = "Offline staged self-evolution engine for K.I.T.T. skills"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@24c104f76d1e2f10055c616bc8f34ad8776d3cd3",
]

[tool.setuptools.packages.find]
include = ["kitt.evolution*"]
namespaces = true

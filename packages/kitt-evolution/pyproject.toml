[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evolution"
version = "0.1.13"
description = "Offline staged self-evolution engine for K.I.T.T. skills"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@bf1cb4542a3fc01a7f60b18d65bbdf6cd566a55b",
]

[tool.setuptools.packages.find]
include = ["kitt.evolution*"]
namespaces = true

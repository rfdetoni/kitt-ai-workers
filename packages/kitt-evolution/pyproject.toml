[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evolution"
version = "0.1.5"
description = "Offline staged self-evolution engine for K.I.T.T. skills"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@ac29ea0cab0e8a2ddca062ed88f1f8cdf47cb3ce",
]

[tool.setuptools.packages.find]
include = ["kitt.evolution*"]
namespaces = true

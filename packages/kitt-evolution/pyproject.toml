[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evolution"
version = "0.1.8"
description = "Offline staged self-evolution engine for K.I.T.T. skills"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@65f8dc6ffab350f948bf4b33dee41d487d97fe3f",
]

[tool.setuptools.packages.find]
include = ["kitt.evolution*"]
namespaces = true

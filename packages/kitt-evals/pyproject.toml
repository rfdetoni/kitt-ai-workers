[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.18"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@f26a3bb10e7f48bfea6251f1b736c4de6068d11b",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

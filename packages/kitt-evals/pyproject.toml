[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.34"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@7d56faec43fa6f5c0e4b1f63c0c18e269a0eb9d8",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

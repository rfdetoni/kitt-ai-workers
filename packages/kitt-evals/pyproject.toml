[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.23"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@ff01b0dd9b397a3261231f705e0c3123f840deda",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.12"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@2141bcab21ab814e03a9b777a9fb0ad7bd1a1b2d",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

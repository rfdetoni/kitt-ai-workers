[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.21"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@7e32445e32e2395f0c89b33b3afcbf6855b0dfd6",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

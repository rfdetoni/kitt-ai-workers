[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.37"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@ca77ea1ffc3b8563adfe24c3b6389ddba9e3adfd",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

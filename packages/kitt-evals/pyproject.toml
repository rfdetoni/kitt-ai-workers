[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.4"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@488c0f7384da78670a71a43575ab7def3338a3a8",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.29"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@4e3eb53437cccfcd7254a338b8051e54e41ae1be",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

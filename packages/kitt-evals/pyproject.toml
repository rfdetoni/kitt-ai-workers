[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.15"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@3367c22e9fee0e8c5ac3fe75ea9c60a23b1e89dd",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

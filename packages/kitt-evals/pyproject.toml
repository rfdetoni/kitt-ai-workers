[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.6"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@badaa9542a8ba7a21789e151e25cf2693da74e4a",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

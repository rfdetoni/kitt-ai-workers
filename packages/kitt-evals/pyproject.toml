[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.25"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@18753fa9b9a80fde7291be576913993b6ee325a8",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.35"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@5315847b09dbe6d0ebbf3f7b714a1b6ceb1469b3",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

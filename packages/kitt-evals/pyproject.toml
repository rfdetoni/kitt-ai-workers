[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.33"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@89a63da16368a59eac5eee185373bfbf89f516b1",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

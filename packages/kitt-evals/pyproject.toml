[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.10"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@33fb8ccf2c4eebbd65c77568fb3934d4d2cc206b",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true

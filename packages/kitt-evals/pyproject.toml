[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitt-evals"
version = "0.1.24"
description = "Evaluation and benchmark suite for K.I.T.T."
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
  "kitt-agent-cli @ git+https://github.com/rfdetoni/kitt-agent-cli.git@e31a6b2f29c84df0b1fd9c075d97935c85a92665",
]

[tool.setuptools.packages.find]
include = ["kitt.evals*"]
namespaces = true
